<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gakiri · Profesionales de la salud</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--deep:#371B63;--lav:#8667E6;--org:#F57407;--bg:#F7F7F7;--surf:#fff;--ink:#333;--mute:#666;--line:#e2dfea;--tint:#efeafc;--link:#6a4cc9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1030;--surf:#251745;--ink:#f2f2f2;--mute:#bdb4d6;--line:#3d2c66;--tint:#2f2057;--link:#b9a6ff}}
:root[data-theme="dark"]{--bg:#1a1030;--surf:#251745;--ink:#f2f2f2;--mute:#bdb4d6;--line:#3d2c66;--tint:#2f2057;--link:#b9a6ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Raleway,"Segoe UI",system-ui,sans-serif;line-height:1.6;font-size:17px}
a{color:inherit}
header{background:var(--deep);color:#f2f2f2;position:sticky;top:0;z-index:5;padding:10px 24px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:500;font-size:22px;letter-spacing:.08em}
.crop{width:46px;height:46px;overflow:hidden;background:var(--deep)}.crop img{width:270px;max-width:none;margin:-62px 0 0 -111px;mix-blend-mode:lighten;display:block}
header nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
header nav a{text-decoration:none;padding:8px 14px;border-radius:999px;font-size:15px;font-weight:500}
header nav a:hover,header nav a.on{background:rgba(255,255,255,.14)}
:is(a,button,input,select,textarea):focus-visible{outline:3px solid var(--org);outline-offset:2px}
.lang{background:none;border:1px solid rgba(255,255,255,.4);color:#f2f2f2;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
main{min-height:70vh}.wrap{max-width:1040px;margin:0 auto;padding:48px 24px}
.hero{background:linear-gradient(135deg,var(--deep) 40%,#5a3aa8 100%);color:#f2f2f2}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;padding-top:56px;padding-bottom:56px}
.hero img{width:100%;max-width:340px;justify-self:center;mix-blend-mode:lighten}
h1{font-weight:300;font-size:clamp(32px,5vw,52px);line-height:1.12;margin:0 0 18px}
h2{font-weight:500;font-size:28px;margin:0 0 12px}h3{font-weight:600;font-size:19px;margin:0 0 4px}
.lead{font-size:19px;max-width:52ch;margin:0 0 28px;opacity:.92}
.btn{display:inline-block;background:var(--org);color:#fff;border:0;border-radius:999px;padding:12px 24px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{background:#d96506}.btn.ghost{background:none;border:1.5px solid currentColor;color:inherit;margin-left:10px}
.btn.sm{padding:8px 16px;font-size:15px}.btn.alt{background:var(--lav)}.btn.alt:hover{background:#6f50d2}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:28px}
.cols p{color:var(--mute);margin:6px 0 0}.cols div{border-top:3px solid var(--lav);padding-top:14px}
.cols div:nth-child(2){border-color:var(--org)}.cols div:nth-child(3){border-color:var(--deep)}
.tools{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin:20px 0 8px}
.loc{display:flex;gap:10px;flex-wrap:wrap;grid-column:1/-1;align-items:center}
.loc input{flex:2;min-width:220px;width:auto}.loc select{width:auto}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:20px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:22px;text-decoration:none;display:block}
.card:hover{border-color:var(--lav)}
.av{width:72px;height:72px;border-radius:50%;background:var(--lav);color:#fff;display:grid;place-items:center;font-weight:600;font-size:24px;margin-bottom:14px;object-fit:cover;object-position:50% 20%}
.av.big{width:132px;height:132px;font-size:42px}
.sp{color:var(--link);font-weight:600;font-size:15px}.meta{color:var(--mute);font-size:15px}
.tag{display:inline-block;background:var(--tint);border-radius:999px;padding:3px 12px;font-size:14px;margin:8px 6px 0 0}
.prof{display:grid;grid-template-columns:1fr 340px;gap:40px}
.side{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:22px;align-self:start}
.side p{margin:0 0 14px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
iframe{width:100%;height:200px;border:0;border-radius:12px;margin-top:10px}
form{display:grid;gap:16px;max-width:620px}label{font-weight:500;font-size:15px;display:grid;gap:6px}
.ok{background:var(--tint);border-left:4px solid var(--org);padding:16px 20px;border-radius:8px}
.note{background:var(--tint);border-left:4px solid var(--lav);padding:14px 18px;border-radius:8px;font-size:15px;margin-top:24px}
.back{display:inline-block;margin-bottom:20px;color:var(--link);font-weight:600;text-decoration:none}
.demo{background:var(--tint);text-align:center;padding:8px 16px;font-size:14px;color:var(--mute)}
footer{background:var(--deep);color:#d9d0f2;padding:28px 24px;text-align:center;font-size:14px}
@media (max-width:760px){.hero .wrap,.prof,.tools{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.hero img{max-width:200px;grid-row:1}}
</style>
</head>

b:["El Dr. Gálvez Molina es un médico general egresado de la Universidad de San Carlos de Guatemala. Ha ejercido en Guatemala, México y España. En España ha trabajado más de 3 años como médico de familia. Tiene certificaciones en diagnósticos preventivos, primeros auxilios a neonatos y primeros auxilios a bordo de naves aeronáuticas.","Dr. Gálvez Molina is a general practitioner who graduated from the Universidad de San Carlos de Guatemala. He has practiced in Guatemala, Mexico and Spain. In Spain he worked for more than 3 years as a family doctor. He holds certifications in preventive diagnostics, neonatal first aid, and first aid aboard aircraft."]},

if(ref)r.sort((a,b)=>a.d-b.d);
return r.length?r.map(({p,d})=>`<a class="card" href="#/profesional/${p.id}">${avatar(p,"")}<h3>${p.n}</h3><div class="sp">${p.s[i()]}</div><div class="meta">${p.y}+ ${x.exp}${d!=null?` · ${d.toFixed(1)} ${x.away}`:""}</div>${p.tags.map(g=>`<span class="tag">${g[i()]}</span>`).join("")}</a>`).join(""):`<p class="meta">${x.none}</p>`}
function dir(){const x=t(),sp=[...new Set(P.map(p=>p.s[0]))];return `<div class="wrap"><h2>${x.dirT}</h2><p class="meta">${x.dirS}</p><div class="tools"><input id="q" type="search" placeholder="${x.search}" aria-label="${x.search}" value="${q}"><select id="fs" aria-label="${x.all}"><option value="">${x.all}</option>${sp.map(s=>`<option value="${s}" ${fs===s?"selected":""}>${P.find(p=>p.s[0]===s).s[i()]}</option>`).join("")}</select>
<div class="loc"><input id="ad" type="search" placeholder="${x.addr}" aria-label="${x.addr}"><button class="btn sm" id="gb">${x.go}</button><button class="btn sm alt" id="mb">${x.me}</button><label style="display:flex;align-items:center;gap:8px;font-weight:500">${x.radius}<select id="rd">${[5,10,25,50,100].map(v=>`<option ${v===rad?"selected":""} value="${v}">${v} km</option>`).join("")}</select></label></div></div>
<p class="meta" id="st">${stat()}</p><div class="grid" id="grid">${list()}</div></div>`}
function stat(){return msg||(ref?`${t().ref}: ${ref.label} (${rad} km) · <a href="#" id="cl" style="color:var(--link)">${t().clear}</a>`:"")}
function prof(id){const x=t(),p=P.find(o=>o.id===id);if(!p)return dir();const gh=location.hostname.endsWith("github.io");
return `<div class="wrap"><a class="back" href="#/profesionales">${x.back}</a><div class="prof"><div>${avatar(p,"big")}<h1 style="font-size:34px;color:var(--ink);margin-top:14px">${p.n}</h1><div class="sp">${p.s[i()]}</div><div>${p.tags.map(g=>`<span class="tag">${g[i()]}</span>`).join("")}</div><h3 style="margin-top:28px">${x.about}</h3><p>${p.b[i()]}</p><div class="note">${x.disc}</div></div>
<aside class="side"><p><strong>${x.lic}</strong><br>${p.lic}</p><p><strong>${x.exp[0].toUpperCase()+x.exp.slice(1)}</strong><br>${p.y}+</p>${p.sex?`<p><strong>${x.sex}</strong><br>${p.sex[i()]}</p>`:""}
<p><strong>${x.loc}</strong><br>${p.addr}</p><div class="acts"><a class="btn sm" target="_blank" rel="noopener" href="${gmap(p)}">📍 ${x.open}</a><a class="btn sm alt" target="_blank" rel="noopener" href="${wz(p)}">${x.waze}</a></div>
${gh?`<iframe title="Mapa" loading="lazy" src="https://www.google.com/maps?q=${encodeURIComponent(p.addr)}&output=embed"></iframe>`:""}<p style="margin-top:18px"><strong>${x.virt}</strong><br>${x.virtVia} ${p.virt}</p></aside></div></div>`}
function about(){const x=t();return `<div class="wrap" style="max-width:720px"><h2>${x.abT}</h2>${x.ab.map(a=>`<p>${a}</p>`).join("")}<div class="note"><h3>${x.discT}</h3><p style="margin:6px 0 0">${x.discB}</p></div></div>`}
function join(){const x=t(),f=x.f;return `<div class="wrap"><h2>${x.jT}</h2><p class="meta">${x.jS}</p><form id="jf"><label>${f.name}<input required></label><label>${f.email}<input required type="email"></label><label>${f.spec}<input required></label><label>${f.city}<input required></label><label>${f.lic}<input required></label><label>${f.msg}<textarea rows="4"></textarea></label><button class="btn" type="submit">${x.send}</button></form></div>`}
function setRef(lat,lng,label){ref={lat,lng,label};msg="";refresh()}
function refresh(){$("#grid").innerHTML=list();$("#st").innerHTML=stat();bindCl()}
function bindCl(){const c=$("#cl");if(c)c.onclick=e=>{e.preventDefault();ref=null;refresh()}}
async function geo(){const v=$("#ad").value.trim();if(!v)return;msg="…";$("#st").textContent=msg;
try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(v)),j=await r.json();if(!j.length)throw 0;setRef(+j[0].lat,+j[0].lon,v)}catch(e){msg=t().geoErr;refresh()}}
function here(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>setRef(p.coords.latitude,p.coords.longitude,t().me.replace(/^Usar |^Use /,"")),()=>{msg=t().geoDeny;refresh()}):(msg=t().geoDeny,refresh())}
function render(){const h=location.hash.replace(/^#\/?/,""),[r,id]=h.split("/"),x=t();document.documentElement.lang=L;
$("#demo").textContent=x.demo;$("#foot").textContent=x.foot;$("#lang").textContent=L==="es"?"EN":"ES";
let k="home",html;if(r==="profesionales"){k="dir";html=dir()}else if(r==="profesional"){k="dir";html=prof(id)}else if(r==="nosotros"){k="about";html=about()}else if(r==="registro"){k="join";html=join()}else html=home();
nav(k);$("#app").innerHTML=html;window.scrollTo(0,0);
if($("#q")){$("#q").oninput=e=>{q=e.target.value;refresh()};$("#fs").onchange=e=>{fs=e.target.value;refresh()};$("#rd").onchange=e=>{rad=+e.target.value;refresh()};$("#gb").onclick=geo;$("#ad").onkeydown=e=>{if(e.key==="Enter")geo()};$("#mb").onclick=here;bindCl()}
const jf=$("#jf");if(jf)jf.onsubmit=e=>{e.preventDefault();jf.outerHTML=`<p class="ok" role="status">${x.done}</p>`}}
$("#lang").onclick=()=>{L=L==="es"?"en":"es";try{localStorage.setItem("gk-lang",L)}catch(e){}render()};
addEventListener("hashchange",render);render();
</script>
</body>
</html>
